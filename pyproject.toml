[project]
name = "curvecarry"
version = "0.1.0"
description = "Yield curve modelling (Nelson-Siegel, Svensson, PCA) and a duration-neutral, FX-hedged G7 carry strategy"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "requests>=2.32",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
]

[project.scripts]
curvecarry = "curvecarry.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curvecarry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
